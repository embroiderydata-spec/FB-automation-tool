name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      NEXT_PUBLIC_SUPABASE_URL: https://cbjjudqdfpunlpcnvsig.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_U2YTYozFeR3sUN7qLq8ikw_XSUZ1Qjp
      TOKEN_ENCRYPTION_KEY: ba411ecef0bd56c7f0fca8d880c24e53909fa6902f6ead279dc460c2acdff4f8

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run Automated Test Suites
        run: npm test

      - name: Production Build Check
        run: npx next build
